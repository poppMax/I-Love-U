<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf7">
  <title>Für dich ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #fffaf7; color: #262626;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 440px); text-align: center; }
    button {
      width: 190px; height: 190px; border: 0; border-radius: 50%;
      background: #16834a; color: white; font-size: 25px; font-weight: 700;
      cursor: pointer; box-shadow: 0 8px 24px #16834a30;
    }
    button:active { transform: scale(.98); }
    .caption { margin: 28px 0 12px; font-size: 22px; line-height: 1.4; }
    #counter { font-size: 16px; line-height: 1.8; font-variant-numeric: tabular-nums; }
    #status { min-height: 1.3em; margin-top: 12px; color: #777; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <button id="play" type="button" aria-label="Sprachnachricht abspielen">▶<br>Drücken</button>
    <audio id="voice" src="nachricht.mp3" preload="metadata"></audio>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="caption">So lange hast du schon mein Herz</div>
    <div id="counter">Berechne Zeit …</div>
  </main>
  <script>
    // 23. August 2026, 17:00 Uhr deutscher Ortszeit.
    const start = new Date(2026, 7, 23, 13, 0, 0).getTime();
    const counter = document.getElementById("counter");
    const audio = document.getElementById("voice");
    const status = document.getElementById("status");

    function updateCounter() {
      let total = Math.max(0, Math.floor((Date.now() - start) / 1000));
      const days = Math.floor(total / 86400); total %= 86400;
      const hours = Math.floor(total / 3600); total %= 3600;
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      counter.textContent =
        `${days} Tage · ${hours} Stunden · ${minutes} Minuten · ${seconds} Sekunden`;
    }
    updateCounter();
    setInterval(updateCounter, 1000);

    document.getElementById("play").addEventListener("click", async () => {
      try {
        audio.pause();
        audio.currentTime = 0;
        await audio.play();
        status.textContent = "";
      } catch (error) {
        status.textContent = "Die Aufnahme konnte nicht geladen werden. Bitte öffne die Seite über den Webserver und achte darauf, dass nachricht.mp3 im selben Ordner liegt.";
      }
    });
    audio.addEventListener("ended", () => status.textContent = "");
  </script>
</body>
</html>
